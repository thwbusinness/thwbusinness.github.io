<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Frequenz-Tagebuch</title>
<meta name="description" content="Tägliches Frequenz-Tagebuch: Morgen- und Abendseiten, Dankbarkeit, Zeichen, 8-Wochen-Programm und Manifestationsziele. Offline und privat." />
<meta name="theme-color" content="#0b0714" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Frequenz" />
<style>
:root{
  --bg:#0b0714; --bg2:#140d24;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10);
  --txt:#ece7f7; --muted:#9c93b5;
  --violet:#a78bfa; --gold:#f5c26b; --mint:#6ee7b7; --rose:#f87171;
  --radius:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  min-height:100dvh;overflow-x:hidden
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 600px at 15% -10%,rgba(167,139,250,.22),transparent 60%),
    radial-gradient(700px 500px at 95% 8%,rgba(245,194,107,.13),transparent 60%),
    radial-gradient(800px 700px at 50% 110%,rgba(110,231,183,.11),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg))
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
p{margin:0 0 10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--violet)}

.app{max-width:640px;margin:0 auto;padding:0 16px calc(104px + var(--safe-b))}
header.top{padding:calc(24px + var(--safe-t)) 2px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hello{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h1.title{font-size:25px;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;backdrop-filter:blur(14px)}
.card h2{font-size:17px;margin-bottom:4px}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .center{text-align:center}
.mt{margin-top:12px} .hidden{display:none !important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  font-weight:600;font-size:15px;color:var(--txt);text-decoration:none;
  transition:transform .12s ease,background .2s ease}
a.btn,a.tag{text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#8b5cf6,#c084fc);border-color:transparent;color:#fff}
.btn.gold{background:linear-gradient(135deg,#f5c26b,#e8a13c);border-color:transparent;color:#2a1c05}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}

label.f{display:block;font-size:13.5px;color:var(--muted);margin:16px 0 6px}
label.f b{color:var(--txt)}
input[type=text],input[type=password],input[type=date],input[type=number],textarea,select{
  width:100%;padding:13px 14px;border-radius:13px;background:rgba(0,0,0,.28);
  border:1px solid var(--line);outline:none}
textarea{min-height:74px;resize:none;overflow:hidden;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--violet)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:34px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#f87171,#f5c26b,#6ee7b7,#a78bfa)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#f87171,#f5c26b,#6ee7b7,#a78bfa)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 2px 12px rgba(0,0,0,.5);border:3px solid #1a1030}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #1a1030}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:rgba(167,139,250,.22);border-color:var(--violet);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.85}

.gauge{display:flex;align-items:center;gap:18px}
.dial{position:relative;width:104px;height:104px;flex:0 0 104px}
.dial svg{transform:rotate(-90deg)}
.dial .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .num{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1}
.dial .unit{font-size:11px;color:var(--muted);margin-top:2px}
.level-name{font-size:18px;font-weight:650}

/* Tagesnavigation */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.daynav .cur{flex:1;text-align:center}
.daynav .cur b{display:block;font-size:16px}
.nav-arrow{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px}
.nav-arrow[disabled]{opacity:.28}

/* Abschnitte */
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
details.sec>summary{
  list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:10px;font-weight:650}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .ico{font-size:17px}
details.sec>summary .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
details.sec>summary::after{content:"⌄";color:var(--muted);transition:transform .2s;margin-left:4px}
details.sec[open]>summary::after{transform:rotate(180deg)}
details.sec .body{padding:0 18px 18px}

.saveind{font-size:12px;color:var(--mint);opacity:0;transition:.25s}
.saveind.on{opacity:1}

.check{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.check:last-child{border-bottom:0}
.box{width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(0,0,0,.2)}
.check.done .box{background:linear-gradient(135deg,#6ee7b7,#34d399);border-color:transparent;color:#04281c}
.check.done .lbl{color:var(--muted);text-decoration:line-through}
.lbl{flex:1}

.goal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px}
.goal .aff{font-size:15.5px;font-style:italic;color:#fff;margin:6px 0 10px;line-height:1.45}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a78bfa,#f5c26b)}
.tag{font-size:11.5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);text-decoration:none}

.entry{border-left:2px solid rgba(167,139,250,.5);padding:2px 0 2px 13px;margin-bottom:14px}
.entry .d{font-size:12px;color:var(--muted);letter-spacing:.04em}
.entry .t{white-space:pre-wrap;margin-top:3px}
.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}

/* Wochen */
.week{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px}
.week.now{border-color:var(--violet);box-shadow:0 0 0 1px rgba(167,139,250,.35)}
.week.past{opacity:.72}
.wnum{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.dots{display:flex;gap:6px;margin-top:10px}
.dots button{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.22);
  font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.dots button.on{background:linear-gradient(135deg,#a78bfa,#8b5cf6);border-color:transparent;color:#fff;font-weight:700}
.dots button.today{border-color:var(--gold);color:var(--gold)}
.dots button.today.on{border-color:var(--gold);color:#fff}
.dots button.future{opacity:.4}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:8px 10px calc(8px + var(--safe-b));
  background:rgba(12,7,22,.88);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav.tabs .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:13px;
  color:var(--muted);text-decoration:none;font-size:10.5px;letter-spacing:.02em}
nav.tabs a.on{color:#fff;background:rgba(167,139,250,.16)}
nav.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.overlay{position:fixed;inset:0;z-index:60;padding-top:calc(24px + var(--safe-t));background:rgba(6,3,12,.93);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding-left:24px;padding-right:24px;padding-bottom:24px;text-align:center}
.breath{width:170px;height:170px;border-radius:50%;margin:26px 0;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(167,139,250,.75) 45%,rgba(139,92,246,.25) 70%,transparent 72%);
  transform:scale(.55);transition:transform 4s cubic-bezier(.4,0,.2,1)}
.breath.big{transform:scale(1)}
.phase{font-size:22px;font-weight:600;min-height:30px}

#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);
  background:#fff;color:#150c26;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.auth-mode header.top,body.auth-mode nav.tabs{display:none}
body.auth-mode .app{padding-top:calc(28px + var(--safe-t));padding-bottom:40px}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .22s ease both}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media print{
  nav.tabs,#toast,.daynav,.btn{display:none !important}
  body{background:#fff;color:#000}
  .card,details.sec{border-color:#ccc;background:#fff}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="hello" id="hello">Willkommen</div>
      <h1 class="title" id="pageTitle">Tagebuch</h1>
    </div>
    <div class="badge" id="streakBadge">✦ 0 Tage</div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs">
  <div class="inner">
    <a href="#/tagebuch" data-tab="tagebuch"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Tagebuch</a>
    <a href="#/wochen" data-tab="wochen"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>8 Wochen</a>
    <a href="#/frequenz" data-tab="frequenz"><svg viewBox="0 0 24 24"><path d="M2 12h3l3-8 4 16 3-11 2 3h5"/></svg>Frequenz</a>
    <a href="#/ziele" data-tab="ziele"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.2L20 9.6l-4 3.9 1 5.5-5-2.8-5 2.8 1-5.5-4-3.9 5.8-1.4z"/></svg>Ziele</a>
    <a href="#/mehr" data-tab="mehr"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>Mehr</a>
  </div>
</nav>

<div id="toast"></div>
<div id="overlayHost"></div>

<script src="config.js"></script>
<script>
"use strict";
/* =========================================================
   Frequenz-Tagebuch
   Ein Tagesbogen pro Tag (Morgen / Tag / Abend), ein
   8-Wochen-Programm und Manifestationsziele.
   Alle Daten bleiben im localStorage dieses Browsers.
   ========================================================= */

var KEY = "frequenz-app-v1";   // Schlüssel bleibt, damit v1-Daten übernommen werden

/* ---------- Datum & Helfer ---------- */
function dkey(d){
  var t = d ? new Date(d) : new Date();
  t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
  return t.toISOString().slice(0,10);
}
function addDays(key, n){
  var d = new Date(key + "T12:00:00");
  d.setDate(d.getDate() + n);
  return dkey(d);
}
function daysBetween(a, b){
  return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function fmtShort(k){ return new Date(k + "T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"short"}); }
function fmtLong(k){ return new Date(k + "T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function toast(msg){
  var t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}

/* ---------- Datenmodell ---------- */
function emptyEntry(date){
  return {
    date: date,
    morning: { level:null, emotion:"", gefuehl:"", absicht:"", dank:["","",""] },
    day:     { zeichen:"", frei:"", booster:[] },
    evening: { level:null, gelungen:"", dankbar:"", losgelassen:"", morgen:"" },
    updatedAt: null
  };
}
/* Jedes Mal ein frisches Objekt: eine geteilte Vorlage würde beim
   Schreiben mitverändert – dann räumt ein Zurücksetzen nichts weg. */
function DEFAULTS(){
  return {
    version: 2,
    name: "",
    journal: {},        // "2026-08-23": entry
    goals: [],
    customBoosters: [],   // selbst ergänzte Frequenz-Booster
    reminders: null,      // {enabled, morning, evening}
    program: null,      // {start:"2026-08-24", weeks:[{title,fokus,aufgabe,tage:[bool x7],reflexion}]}
    createdAt: null,
    lastSync: null,     // Zeitpunkt der letzten erfolgreichen Synchronisation
    metaUpdatedAt: 0,   // Name + Programm (für die Konfliktauflösung)
    metaDirty: false
  };
}

function migrate(s){
  if(!s || typeof s !== "object") s = {};
  s = Object.assign({}, DEFAULTS(), s);
  s.journal = s.journal || {};
  if(s.version < 2){
    // v1 (checkins / gratitude / reflections) in Tagesbögen überführen
    Object.keys(s.checkins || {}).forEach(function(k){
      var e = s.journal[k] || emptyEntry(k);
      e.morning.level = s.checkins[k].level;
      e.morning.emotion = s.checkins[k].emotion || "";
      if(s.checkins[k].note) e.day.frei = s.checkins[k].note;
      s.journal[k] = e;
    });
    (s.gratitude || []).forEach(function(g){
      var e = s.journal[g.date] || emptyEntry(g.date);
      var i = e.morning.dank.indexOf("");
      if(i >= 0) e.morning.dank[i] = g.text;
      else e.morning.dank.push(g.text);
      s.journal[g.date] = e;
    });
    (s.reflections || []).forEach(function(r){
      var e = s.journal[r.date] || emptyEntry(r.date);
      e.evening.gelungen = r.gelungen || "";
      e.evening.losgelassen = r.loslassen || "";
      e.evening.morgen = r.morgen || "";
      s.journal[r.date] = e;
    });
    delete s.checkins; delete s.gratitude; delete s.reflections; delete s.rituals;
    s.version = 2;
  }
  if(!s.createdAt) s.createdAt = dkey();
  return s;
}
function load(){
  try{ return migrate(JSON.parse(localStorage.getItem(KEY))); }
  catch(e){ return migrate(null); }
}
var S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast("Speichern nicht möglich (Speicher voll?)"); return false; }
}
function entryOf(date, create){
  if(!S.journal[date]){
    if(!create) return emptyEntry(date);
    S.journal[date] = emptyEntry(date);
  }
  return S.journal[date];
}
function hasContent(e){
  if(!e) return false;
  if(e.morning.level !== null || e.evening.level !== null) return true;
  if((e.day.booster || []).length) return true;
  var txt = [e.morning.gefuehl, e.morning.absicht, e.morning.emotion, e.day.zeichen, e.day.frei,
             e.evening.gelungen, e.evening.dankbar, e.evening.losgelassen, e.evening.morgen]
            .concat(e.morning.dank).join("").trim();
  return txt.length > 0;
}
/* Ein Tag zählt für das 8-Wochen-Programm, wenn die tägliche Runde
   wirklich gedreht wurde: Frequenz erfasst, morgens ausgerichtet,
   abends abgeschlossen. Nichts davon wird von Hand abgehakt. */
function dayChecklist(k){
  var e = S.journal[k] || emptyEntry(k);
  var morgens = countFilled([e.morning.absicht].concat(e.morning.dank)) > 0;
  var abends  = countFilled([e.evening.gelungen, e.evening.dankbar, e.evening.losgelassen, e.evening.morgen]) > 0;
  return [
    { k:"freq",   t:"Frequenz eingetragen",              ok: e.morning.level !== null || e.evening.level !== null },
    { k:"morgen", t:"Morgens ausgerichtet oder gedankt", ok: morgens },
    { k:"abend",  t:"Abendseite ausgefüllt",             ok: abends }
  ];
}
function dayComplete(k){
  return dayChecklist(k).every(function(x){ return x.ok; });
}
function filledDays(){
  return Object.keys(S.journal).filter(function(k){ return hasContent(S.journal[k]); }).sort();
}
/* Gelöschte Ziele bleiben als Grabstein liegen, damit der Sync sie nicht
   auf anderen Geräten wieder aufleben lässt. */
function goals(){ return S.goals.filter(function(g){ return !g.deleted; }); }
function touch(g){ g.updatedAt = Date.now(); g.dirty = true; return g; }
function touchMeta(){ S.metaUpdatedAt = Date.now(); S.metaDirty = true; }

/* ---------- Frequenz-Skala ---------- */
/* An die Bewusstseinsebenen nach David R. Hawkins angelehnt, auf 0–100 gebracht. */
var EMOTIONS = [
  {n:"Scham",v:5,c:"#f87171"},{n:"Schuld",v:10,c:"#f87171"},{n:"Apathie",v:16,c:"#f87171"},
  {n:"Trauer",v:22,c:"#fb923c"},{n:"Angst",v:28,c:"#fb923c"},{n:"Verlangen",v:34,c:"#fbbf24"},
  {n:"Wut",v:40,c:"#fbbf24"},{n:"Stolz",v:46,c:"#f5c26b"},{n:"Mut",v:55,c:"#a3e635"},
  {n:"Neutralität",v:62,c:"#6ee7b7"},{n:"Bereitschaft",v:68,c:"#6ee7b7"},{n:"Annahme",v:74,c:"#34d399"},
  {n:"Klarheit",v:80,c:"#5eead4"},{n:"Liebe",v:88,c:"#a78bfa"},{n:"Freude",v:93,c:"#c084fc"},
  {n:"Frieden",v:98,c:"#e9d5ff"}
];
function bandOf(v){
  if(v < 30) return {name:"Schwere Frequenz",  color:"#f87171", hint:"Dein System will Entlastung – nicht Leistung."};
  if(v < 50) return {name:"Aufbruch",          color:"#fbbf24", hint:"Bewegung löst mehr als Nachdenken."};
  if(v < 65) return {name:"Mut & Klarheit",    color:"#a3e635", hint:"Gute Basis: jetzt eine bewusste Entscheidung treffen."};
  if(v < 80) return {name:"Fließende Frequenz",color:"#6ee7b7", hint:"Ideal, um zu handeln und zu säen."};
  if(v < 92) return {name:"Hohe Frequenz",     color:"#a78bfa", hint:"Perfekt zum Visualisieren – du bist empfänglich."};
  return       {name:"Frieden",                color:"#e9d5ff", hint:"Halte diesen Zustand einfach – nichts tun müssen."};
}
var BOOSTERS = {
  low:  ["4 Runden Box-Atmung","10 Minuten raus an die Luft","Ein Glas Wasser, Schultern lockern",
         "Lieblingssong laut hören","5 Minuten Gedankenmüll aufschreiben"],
  mid:  ["3 Dinge notieren, die heute gut laufen","20 Minuten bewegen","Eine aufgeschobene Sache erledigen",
         "Jemandem eine nette Nachricht schreiben","Box-Atmung, 4 Runden"],
  high: ["5 Minuten Zielbild visualisieren","Affirmation 9x schreiben","Dankbarkeit für etwas, das noch kommt",
         "Einen mutigen Schritt Richtung Ziel gehen","Diesen Zustand kurz still genießen"]
};
function boostersFor(v){
  var base = v < 45 ? BOOSTERS.low : (v < 75 ? BOOSTERS.mid : BOOSTERS.high);
  return base.concat(S.customBoosters || []);
}
function boosterDone(day, text){
  var e = S.journal[day];
  return !!(e && (e.day.booster || []).indexOf(text) >= 0);
}
function toggleBooster(day, text){
  var e = entryOf(day, true);
  e.day.booster = e.day.booster || [];
  var i = e.day.booster.indexOf(text);
  if(i >= 0) e.day.booster.splice(i, 1); else e.day.booster.push(text);
  e.updatedAt = Date.now(); e.dirty = true;
  save(); syncSoon();
  return i < 0;
}
/* Eine antippbare Booster-Liste. day = Tag, auf den sie gebucht wird. */
function boosterList(day, level){
  var list = boostersFor(level);
  var done = (S.journal[day] && S.journal[day].day.booster) || [];
  return list.map(function(t){
    var isDone = done.indexOf(t) >= 0;
    return `<button class="check ${isDone ? "done" : ""}" data-boost="${esc(t)}" data-boostday="${day}">
      <span class="box">${isDone ? "✓" : "✦"}</span><span class="lbl small">${esc(t)}</span>
    </button>`;
  }).join("");
}
function bindBoosters(){
  $$("[data-boost]").forEach(function(b){
    b.addEventListener("click", function(){
      var on = toggleBooster(b.getAttribute("data-boostday"), b.getAttribute("data-boost"));
      render();
      if(on) toast("Gemacht ✦");
    });
  });
  var add = $("#addBooster"), inp = $("#newBooster");
  function addIt(){
    var v = inp.value.trim();
    if(!v) return;
    S.customBoosters = S.customBoosters || [];
    if(S.customBoosters.indexOf(v) < 0) S.customBoosters.push(v);
    touchMeta(); save(); render(); toast("Booster ergänzt ✦");
  }
  if(add) add.addEventListener("click", addIt);
  if(inp) inp.addEventListener("keydown", function(e){ if(e.key === "Enter") addIt(); });
  $$("[data-delboost]").forEach(function(b){
    b.addEventListener("click", function(){
      var t = b.getAttribute("data-delboost");
      S.customBoosters = (S.customBoosters || []).filter(function(x){ return x !== t; });
      touchMeta(); save(); render();
    });
  });
}

function dayLevel(e){
  if(!e) return null;
  var m = e.morning.level, a = e.evening.level;
  if(m === null && a === null) return null;
  if(m === null) return a;
  if(a === null) return m;
  return Math.round((m + a) / 2);
}
function streak(){
  var n = 0, k = dkey();
  if(!hasContent(S.journal[k])) k = addDays(k, -1);   // heute darf noch offen sein
  while(hasContent(S.journal[k])){ n++; k = addDays(k, -1); }
  return n;
}
function lastDays(n){
  var out = [], k = dkey();
  for(var i = n - 1; i >= 0; i--) out.push(addDays(k, -i));
  return out;
}
function avgLevel(days){
  var vals = days.map(function(d){ return dayLevel(S.journal[d]); }).filter(function(v){ return v !== null && v !== undefined; });
  if(!vals.length) return null;
  return Math.round(vals.reduce(function(a,b){ return a+b; },0) / vals.length);
}

/* =========================================================

   ========================================================= */
function dial(value, label){
  var has = value !== null && value !== undefined;
  var v = has ? value : 0;
  var b = bandOf(has ? v : 50);
  var r = 43, c = 2 * Math.PI * r;
  var off = c * (1 - Math.max(0, Math.min(100, v)) / 100);
  return `<div class="dial">
    <svg width="104" height="104" viewBox="0 0 104 104">
      <circle cx="52" cy="52" r="${r}" stroke="rgba(255,255,255,.09)" stroke-width="9" fill="none"/>
      <circle cx="52" cy="52" r="${r}" stroke="${has ? b.color : "transparent"}" stroke-width="9" fill="none"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="val"><div class="num">${has ? v : "–"}</div><div class="unit">${esc(label || "Frequenz")}</div></div>
  </div>`;
}
function progressBar(pct){ return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`; }
function emptyState(text){
  return `<div class="card center" style="padding:26px 18px">
    <div style="font-size:28px;margin-bottom:8px">✦</div><p class="muted small">${esc(text)}</p></div>`;
}

/* ---------- Pfad-Zugriff für Autosave ---------- */
function getPath(o, path){
  return path.split(".").reduce(function(a, k){ return (a == null) ? undefined : a[k]; }, o);
}
function setPath(o, path, val){
  var p = path.split("."), t = o;
  for(var i = 0; i < p.length - 1; i++){ if(t[p[i]] == null) t[p[i]] = {}; t = t[p[i]]; }
  t[p[p.length-1]] = val;
}
var saveTimer = null;
function autosave(){
  var e = entryOf(ui.day, true);
  e.updatedAt = Date.now();
  e.dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    save();
    var ind = $("#saveind");
    if(ind){ ind.classList.add("on"); setTimeout(function(){ ind.classList.remove("on"); }, 1300); }
    updateStreakBadge();
    syncSoon();
  }, 400);
  updateCounts();
  updateDayStatus();
}
function autoGrow(el){ el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }

function field(path, placeholder, value){
  return `<textarea data-j="${path}" placeholder="${esc(placeholder)}">${esc(value || "")}</textarea>`;
}

function countFilled(arr){
  return arr.filter(function(x){ return String(x || "").trim(); }).length;
}
/* Die Tagesabschluss-Karte ohne Neuzeichnen mitziehen, damit sie
   beim Tippen sofort stimmt und der Fokus im Feld bleibt. */
function updateDayStatus(){
  var list = dayChecklist(ui.day);
  var alle = list.every(function(x){ return x.ok; });
  list.forEach(function(x){
    var el = $('[data-dayitem="' + x.k + '"]');
    if(!el) return;
    el.classList.toggle("done", x.ok);
    el.querySelector(".box").textContent = x.ok ? "✓" : "";
  });
  var badge = $("#dayBadge");
  if(badge){
    badge.textContent = alle ? "abgeschlossen ✦" : (list.filter(function(x){ return x.ok; }).length + "/3");
    badge.style.color = alle ? "var(--mint)" : "";
  }
  var sub = $("#daySub");
  if(sub){
    sub.textContent = alle
      ? "Dieser Tag zählt für dein 8-Wochen-Programm."
      : "Sobald diese drei Punkte stehen, zählt der Tag im Programm.";
  }
}
function updateCounts(){
  var e = entryOf(ui.day);
  var map = {
    morning: countFilled([e.morning.gefuehl, e.morning.absicht].concat(e.morning.dank)),
    day:     countFilled([e.day.zeichen, e.day.frei]),
    evening: countFilled([e.evening.gelungen, e.evening.dankbar, e.evening.losgelassen, e.evening.morgen])
  };
  $$("[data-cnt]").forEach(function(el){
    var n = map[el.getAttribute("data-cnt")];
    el.textContent = n ? (n === 1 ? "1 Feld" : n + " Felder") : "";
  });
}
function affirmationOfDay(d){
  var pool = AFFIRMATIONS.slice();
  goals().filter(function(g){ return !g.done && g.affirmation; }).forEach(function(g){ pool.push(g.affirmation); });
  var day = Math.floor(new Date(d + "T12:00:00").getTime() / 86400000);
  return pool[(day + (affirmationOfDay._o || 0)) % pool.length];
}

];
function newProgram(start){
  return { start: start, weeks: WEEK_TEMPLATE.map(function(w){
    return { title:w.title, fokus:w.fokus, aufgabe:w.aufgabe, tage:[false,false,false,false,false,false,false], reflexion:"" };
  })};
}
function weekInfo(date){
  var p = S.program;
  if(!p || !p.start) return null;
  var diff = daysBetween(p.start, date);
  if(diff < 0) return null;
  var nr = Math.floor(diff / 7) + 1;
  if(nr > 8) return null;
  return { nr:nr, idx:nr-1, dayIdx: diff % 7, week: p.weeks[nr-1] };
}

function viewWochen(){

  if(!p){

      <div class="dots">${tage.map(function(t, di){
        return `<button class="${t.ok ? "on" : ""} ${t.heute ? "today" : ""} ${t.zukunft ? "future" : ""}"
          data-goday="${t.key}" title="${fmtShort(t.key)}${t.ok ? " – abgeschlossen" : (t.zukunft ? " – kommt noch" : " – offen")}">${di+1}</button>`;

      ${open ? `<div class="mt pop" style="border-top:1px solid var(--line);padding-top:12px">
        <label class="f">Titel der Woche</label>
        <input type="text" data-w="${i}.title" value="${esc(w.title)}" maxlength="60" />
        <label class="f">Fokus</label>
        <textarea data-w="${i}.fokus" placeholder="Worum geht es diese Woche?">${esc(w.fokus)}</textarea>

        <textarea data-w="${i}.aufgabe" placeholder="Was mache ich diese Woche jeden Tag?">${esc(w.aufgabe)}</textarea>

    </div>`;
  }).join("");

  return `
    <div class="card">
      <div class="between">
        <div>
          <h2>${cur ? "Woche " + cur.nr + " von 8" : (daysBetween(p.start, dkey()) < 0 ? "Startet bald" : "Programm beendet")}</h2>
          <div class="tiny muted">${fmtShort(p.start)} – ${fmtShort(ende)} · ${totalDone}/56 Tage</div>
        </div>
        <span class="tag">${Math.round(totalDone/56*100)}%</span>
      </div>
      <div class="mt">${progressBar(totalDone/56*100)}</div>
      <p class="tiny muted" style="margin-top:8px">Ein Tag füllt sich von selbst, sobald du Frequenz,
        Morgen- und Abendseite ausgefüllt hast. Tippe einen Tag an, um ihn im Tagebuch zu öffnen.</p>
      ${cur ? `<div class="small" style="margin-top:12px"><b id="curWeekTitle">${esc(cur.week.title)}</b> – <span id="curWeekTask">${esc(cur.week.aufgabe)}</span></div>` : ""}
    </div>
    ${cards}
    <button class="btn ghost wide" id="resetProg" style="color:var(--rose);margin-bottom:14px">Programm zurücksetzen</button>

            <div class="tiny muted">${(function(){
              if(!e || !hasContent(e)) return "leer – nachtragen?";

              var boost = (e.day.booster || []).length;

            })()}</div>

      <div class="between" style="margin-bottom:6px">

      ${boosterList(dkey(), dayLevel(S.journal[dkey()]) === null ? 50 : dayLevel(S.journal[dkey()]))}

function chart30(){
  var days = lastDays(30), W = 560, H = 150, pad = 12;
  var stepX = (W - pad*2) / (days.length - 1);
  var pts = [];
  days.forEach(function(d, i){
    var lvl = dayLevel(S.journal[d]);
    if(lvl === null || lvl === undefined) return;
    pts.push([pad + i*stepX, H - pad - (lvl/100)*(H - pad*2), d, lvl]);
  });
  if(!pts.length) return `<p class="small muted">Noch keine Werte – trag deine Frequenz im Tagebuch ein.</p>`;

  var line = pts.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${H-pad} L${pts[0][0].toFixed(1)} ${H-pad} Z`;
  var dots = pts.map(function(p){
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${pts.length < 4 ? 5 : 3.4}" fill="${bandOf(p[3]).color}"><title>${fmtShort(p[2])}: ${p[3]}</title></circle>`;
  }).join("");
  var grid = [0,25,50,75,100].map(function(v){
    var y = H - pad - (v/100)*(H - pad*2);
    return `<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/>`;
  }).join("");

  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="min-width:320px">
    <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(167,139,250,.45)"/><stop offset="100%" stop-color="rgba(167,139,250,0)"/>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#fill)"/>
    <path d="${line}" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg></div>
  <div class="between tiny muted"><span>${fmtShort(days[0])}</span><span>heute</span></div>`;
}

    <div class="tiny muted">${esc(label)}</div>

function doWrite(id){
  var g = goals().filter(function(x){ return x.id === id; })[0];
  if(!g) return;
  var inp = $('[data-write="' + id + '"]');
  var typed = normalize(inp.value), target = normalize(g.affirmation);
  if(!typed){ inp.classList.add("shake"); setTimeout(function(){ inp.classList.remove("shake"); }, 320); return; }
  if(typed !== target && typed.length < target.length * 0.6){
    inp.classList.add("shake"); setTimeout(function(){ inp.classList.remove("shake"); }, 320);
    toast("Schreib sie ganz aus – das ist der Punkt."); return;
  }
  var today = dkey();
  g.writes = g.writes || {};
  g.writes[today] = (g.writes[today] || 0) + 1;
  touch(g);
  var m = METHODS[g.method] || METHODS["369"], n = g.writes[today];
  save(); render();
  var again = $('[data-write="' + id + '"]');
  if(again) again.focus();
  toast(n >= m.total ? "Tagespensum geschafft ✦" : n + "/" + m.total);
}

function journalAsText(){
  var out = ["FREQUENZ-TAGEBUCH", S.name ? "von " + S.name : "", "Export: " + fmtLong(dkey()), ""];
  filledDays().reverse().forEach(function(k){
    var e = S.journal[k], lvl = dayLevel(e);
    out.push("──────────────────────────────");
    out.push(fmtLong(k) + (lvl === null ? "" : "   Frequenz: " + lvl + (e.morning.emotion ? " (" + e.morning.emotion + ")" : "")));
    out.push("");
    if(e.morning.gefuehl)  out.push("Wie ich mich fühle:\n" + e.morning.gefuehl + "\n");
    if(e.morning.absicht)  out.push("Wie ich mich fühlen will:\n" + e.morning.absicht + "\n");
    var dank = e.morning.dank.filter(Boolean);
    if(dank.length)        out.push("Dankbarkeit:\n" + dank.map(function(x){ return "· " + x; }).join("\n") + "\n");
    if((e.day.booster || []).length) out.push("Frequenz-Booster:\n" + e.day.booster.map(function(x){ return "· " + x; }).join("\n") + "\n");
    if(e.day.zeichen)      out.push("Zeichen & Synchronizitäten:\n" + e.day.zeichen + "\n");
    if(e.day.frei)         out.push("Freies Schreiben:\n" + e.day.frei + "\n");
    if(e.evening.gelungen) out.push("Gelungen:\n" + e.evening.gelungen + "\n");
    if(e.evening.dankbar)  out.push("Abends dankbar für:\n" + e.evening.dankbar + "\n");
    if(e.evening.losgelassen) out.push("Losgelassen:\n" + e.evening.losgelassen + "\n");
    if(e.evening.morgen)   out.push("Morgen:\n" + e.evening.morgen + "\n");
  });
  if(S.program){
    out.push("──────────────────────────────", "8-WOCHEN-PROGRAMM (Start " + fmtLong(S.program.start) + ")", "");
    S.program.weeks.forEach(function(w, i){
      var c = 0;
      for(var t = 0; t < 7; t++){ if(dayComplete(addDays(S.program.start, i*7 + t))) c++; }
      out.push("Woche " + (i+1) + ": " + w.title + "  [" + c + "/7 Tage abgeschlossen]");
      if(w.fokus) out.push("Fokus: " + w.fokus);
      if(w.aufgabe) out.push("Aufgabe: " + w.aufgabe);
      if(w.reflexion) out.push("Reflexion: " + w.reflexion);
      out.push("");
    });
  }
  return out.join("\n");
}

}

/* =========================================================
   Konto & Synchronisation (Supabase, ohne SDK – nur fetch)

   Ablauf: lokal wird immer sofort gespeichert. Der Sync holt
   danach alle Datensätze vom Server, übernimmt jeweils den
   neueren (Vergleich über updated_at) und schiebt alles hoch,
   was lokal geändert wurde. Ohne Netz passiert schlicht nichts.
   ========================================================= */
var CFG_KEY = "frequenz-config";
var SESSION_KEY = "frequenz-session";
var CFG = {};
function readConfig(){
  var shipped = window.FREQUENZ_CONFIG || {};
  if(shipped.url && shipped.anonKey) return Object.assign({}, shipped);
  try{ return Object.assign({}, shipped, JSON.parse(localStorage.getItem(CFG_KEY) || "{}")); }
  catch(e){ return Object.assign({}, shipped); }
}
CFG = readConfig();
function configIsLocal(){
  var shipped = window.FREQUENZ_CONFIG || {};
  return !(shipped.url && shipped.anonKey);
}

function syncConfigured(){ return !!(CFG.url && CFG.anonKey); }
function baseUrl(){ return String(CFG.url || "").replace(/\/+$/, ""); }

var sess = null;
try{ sess = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){ sess = null; }
function setSession(x){
  sess = x;
  if(x) localStorage.setItem(SESSION_KEY, JSON.stringify(x));
  else localStorage.removeItem(SESSION_KEY);
}
function loggedIn(){ return !!(sess && sess.access_token && sess.user); }

function api(path, opts){
  opts = opts || {};
  var h = { "apikey": CFG.anonKey, "Content-Type": "application/json" };
  Object.keys(opts.headers || {}).forEach(function(k){ h[k] = opts.headers[k]; });
  if(!opts.noAuth && sess && sess.access_token) h["Authorization"] = "Bearer " + sess.access_token;
  return fetch(baseUrl() + path, { method: opts.method || "GET", headers: h, body: opts.body })
    .then(function(r){
      return r.text().then(function(t){
        var data = null;
        try{ data = t ? JSON.parse(t) : null; }catch(e2){ data = t; }
        if(!r.ok){
          var msg = (data && (data.msg || data.message || data.error_description || data.error_code || data.error)) || ("HTTP " + r.status);
          var err = new Error(String(msg)); err.status = r.status;
          throw err;
        }
        return data;
      });
    });
}
function storeToken(d){
  if(!d || !d.access_token) return d;
  setSession({
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    expires_at: Date.now() + ((d.expires_in || 3600) * 1000) - 60000,
    user: d.user
  });
  return d;
}
function authSignUp(email, pw){
  return api("/auth/v1/signup", {method:"POST", noAuth:true, body:JSON.stringify({email:email, password:pw})})
    .then(function(d){ if(d && d.access_token) storeToken(d); return d; });
}
function authSignIn(email, pw){
  return api("/auth/v1/token?grant_type=password", {method:"POST", noAuth:true,
    body: JSON.stringify({email:email, password:pw})}).then(storeToken);
}
function ensureToken(){
  if(!loggedIn()) return Promise.reject(new Error("Nicht angemeldet"));
  if(Date.now() < (sess.expires_at || 0)) return Promise.resolve();
  return api("/auth/v1/token?grant_type=refresh_token", {method:"POST", noAuth:true,
    body: JSON.stringify({refresh_token: sess.refresh_token})})
    .then(storeToken)
    .catch(function(e){
      // Erneuern gescheitert: die Sitzung ist endgültig hin.
      if(e && (e.status === 400 || e.status === 401 || e.status === 403)) sessionAbgelaufen();
      throw e;
    });
}
/* Eine tote Sitzung darf nicht still weiterlaufen – sonst schreibt man
   weiter und nichts davon kommt je in der Datenbank an. */
function sessionAbgelaufen(){
  if(!loggedIn()) return;
  setSession(null);
  S.lastSync = null;          // beim nächsten Anmelden alles neu hochschieben
  markiereAllesGeaendert();
  save();
  ui.auth.mode = "login";
  ui.auth.msgOk = false;
  ui.auth.msg = "Deine Sitzung ist abgelaufen. Bitte melde dich neu an – geschrieben ist alles noch da.";
  render();
}
function markiereAllesGeaendert(){
  Object.keys(S.journal).forEach(function(k){ S.journal[k].dirty = true; });
  S.goals.forEach(function(g){ g.dirty = true; });
  S.metaDirty = true;
}

var syncState = { running:false, error:null };
/* Prüft jede Tabelle einzeln, damit beim Einrichten klar ist, was fehlt. */
function pruefeSchema(){
  var tabellen = ["journal_entries", "goals", "app_meta", "push_subscriptions"];
  return ensureToken().then(function(){
    return Promise.all(tabellen.map(function(t){
      return api("/rest/v1/" + t + "?select=user_id&limit=1")
        .then(function(){ return { name:t, ok:true }; })
        .catch(function(e){ return { name:t, ok:false, grund:e && e.message }; });
    }));
  });
}
function syncStatusText(){
  if(!syncConfigured()) return "Keine Verbindung eingerichtet";
  if(!loggedIn())       return "Nicht angemeldet – Daten nur auf diesem Gerät";
  if(syncState.running) return "Synchronisiert …";
  if(syncState.error)   return "Letzter Versuch fehlgeschlagen: " + syncState.error;
  if(!S.lastSync)       return "Noch nicht synchronisiert";
  var mins = Math.round((Date.now() - S.lastSync) / 60000);
  if(mins < 1) return "Gerade synchronisiert ✓";
  if(mins < 60) return "Zuletzt vor " + mins + " Min. synchronisiert";
  return "Zuletzt am " + new Date(S.lastSync).toLocaleString("de-DE");
}
function paintSyncStatus(){
  var el = $("#syncStatus");
  if(el) el.textContent = syncStatusText();
}

function entryPayload(e){
  return { morning:e.morning, day:e.day, evening:e.evening };
}
function goalPayload(g){
  var out = {};
  Object.keys(g).forEach(function(k){
    if(k !== "dirty" && k !== "updatedAt" && k !== "deleted" && k !== "id") out[k] = g[k];
  });
  return out;
}
function mergeRemote(jrows, grows, mrows){
  var changed = false;
  (jrows || []).forEach(function(row){
    var loc = S.journal[row.date];
    var rts = Number(row.updated_at) || 0;
    if(!loc || rts > (loc.updatedAt || 0)){
      var e = emptyEntry(row.date);
      if(row.data){
        if(row.data.morning) e.morning = Object.assign(e.morning, row.data.morning);
        if(row.data.day)     e.day     = Object.assign(e.day, row.data.day, {booster: row.data.day.booster || []});
        if(row.data.evening) e.evening = Object.assign(e.evening, row.data.evening);
      }
      e.updatedAt = rts; e.dirty = false;
      S.journal[row.date] = e;
      changed = true;
    }
  });
  (grows || []).forEach(function(row){
    var rts = Number(row.updated_at) || 0;
    var loc = null;
    S.goals.forEach(function(g){ if(g.id === row.id) loc = g; });
    if(!loc){
      S.goals.push(Object.assign({}, row.data, {id:row.id, deleted:!!row.deleted, updatedAt:rts, dirty:false}));
      changed = true;
    }else if(rts > (loc.updatedAt || 0)){
      Object.keys(loc).forEach(function(k){ if(k !== "id") delete loc[k]; });
      Object.assign(loc, row.data, {deleted:!!row.deleted, updatedAt:rts, dirty:false});
      changed = true;
    }
  });
  if(mrows && mrows.length){
    var m = mrows[0], rts = Number(m.updated_at) || 0;
    if(rts > (S.metaUpdatedAt || 0)){
      if(m.data && typeof m.data.name === "string") S.name = m.data.name;
      if(m.data && m.data.program !== undefined) S.program = m.data.program;
      if(m.data && Array.isArray(m.data.customBoosters)) S.customBoosters = m.data.customBoosters;
      if(m.data && m.data.reminders) S.reminders = m.data.reminders;
      S.metaUpdatedAt = rts; S.metaDirty = false;
      changed = true;
    }
  }
  return changed;
}

function doSync(silent){
  if(!syncConfigured() || !loggedIn()) return Promise.resolve(false);
  if(syncState.running) return Promise.resolve(false);
  if(navigator.onLine === false){
    syncState.error = "offline"; paintSyncStatus(); return Promise.resolve(false);
  }
  syncState.running = true; syncState.error = null; paintSyncStatus();
  var uid_ = sess.user.id;
  var first = !S.lastSync;

  return ensureToken()
    .then(function(){
      return Promise.all([
        api("/rest/v1/journal_entries?select=date,data,updated_at"),
        api("/rest/v1/goals?select=id,data,deleted,updated_at"),
        api("/rest/v1/app_meta?select=data,updated_at")
      ]);
    })
    .then(function(res){
      var changed = mergeRemote(res[0], res[1], res[2]);

      var jrows = [], grows = [], mrow = null;
      Object.keys(S.journal).forEach(function(k){
        var e = S.journal[k];
        if((e.dirty || first) && hasContent(e)){
          jrows.push({ user_id:uid_, date:k, data:entryPayload(e), updated_at: e.updatedAt || Date.now() });
        }
      });
      S.goals.forEach(function(g){
        if(g.dirty || first){
          grows.push({ user_id:uid_, id:g.id, data:goalPayload(g), deleted: !!g.deleted, updated_at: g.updatedAt || Date.now() });
        }
      });
      if(S.metaDirty || first){
        mrow = { user_id:uid_, data:{ name:S.name, program:S.program, customBoosters:S.customBoosters || [],
                                     reminders:S.reminders || null },
                 updated_at: S.metaUpdatedAt || Date.now() };
      }

      var jobs = [];
      var pref = { "Prefer": "resolution=merge-duplicates,return=minimal" };
      if(jrows.length) jobs.push(api("/rest/v1/journal_entries?on_conflict=user_id,date", {method:"POST", headers:pref, body:JSON.stringify(jrows)}));
      if(grows.length) jobs.push(api("/rest/v1/goals?on_conflict=user_id,id",            {method:"POST", headers:pref, body:JSON.stringify(grows)}));
      if(mrow)         jobs.push(api("/rest/v1/app_meta?on_conflict=user_id",            {method:"POST", headers:pref, body:JSON.stringify([mrow])}));

      return Promise.all(jobs).then(function(){
        Object.keys(S.journal).forEach(function(k){ S.journal[k].dirty = false; });
        S.goals.forEach(function(g){ g.dirty = false; });
        S.metaDirty = false;
        S.lastSync = Date.now();
        syncState.running = false;
        save();
        if(changed && !silent) render(); else paintSyncStatus();
        return true;
      });
    })
    .catch(function(err){
      syncState.running = false;
      if(err && (err.status === 401 || err.status === 403)){
        sessionAbgelaufen();
        return false;
      }
      syncState.error = translateAuthError(err && err.message);
      paintSyncStatus();
      if(!silent) toast("Sync fehlgeschlagen: " + syncState.error);
      return false;
    });
}

var syncTimer = null;
function syncSoon(){
  if(!syncConfigured() || !loggedIn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ doSync(true); }, 4000);

/* =========================================================
   Registrierung & Anmeldung

   Wer die App zum ersten Mal öffnet, landet auf einem
   Willkommensbildschirm: Konto anlegen, anmelden – oder bewusst
   ohne Konto weitermachen (dann bleibt alles auf dem Gerät).
   Bestätigungs- und Passwort-Links von Supabase kommen mit
   Tokens im URL-Fragment zurück und werden hier eingelöst.
   ========================================================= */
var LOCAL_ONLY_KEY = "frequenz-local-only";
function localOnly(){ return localStorage.getItem(LOCAL_ONLY_KEY) === "1"; }
function setLocalOnly(v){
  if(v) localStorage.setItem(LOCAL_ONLY_KEY, "1");
  else localStorage.removeItem(LOCAL_ONLY_KEY);
}
function authGateActive(){
  // Nach einem Passwort-Link ist man bereits angemeldet – der Bildschirm zum
  // Setzen des neuen Passworts muss trotzdem erscheinen.
  if(ui && ui.auth && ui.auth.mode === "newpw") return true;
  return syncConfigured() && !loggedIn() && !localOnly();
}
function redirectTarget(){
  return location.origin + location.pathname;
}

/* ---------- Tokens aus dem Rücksprung einlösen ---------- */
function parseHashParams(){
  var h = String(location.hash || "").replace(/^#\/?/, "");
  if(h.indexOf("=") < 0) return null;
  var out = {};
  h.split("&").forEach(function(kv){
    var i = kv.indexOf("=");
    if(i < 0) return;
    out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i+1).replace(/\+/g, " "));
  });
  return out;
}
function fetchUser(){
  return api("/auth/v1/user").then(function(u){
    if(sess && u && u.id){ sess.user = u; setSession(sess); }
    return u;
  });
}
/* Gibt true zurück, wenn die URL ein Auth-Rücksprung war. */
function consumeAuthHash(){
  var p = parseHashParams();
  if(!p) return false;
  if(p.error || p.error_description){
    ui.auth.mode = "login";
    ui.auth.msg = p.error_description || p.error;
    history.replaceState(null, "", redirectTarget() + "#/tagebuch");
    return true;
  }
  if(!p.access_token) return false;

  setSession({
    access_token: p.access_token,
    refresh_token: p.refresh_token,
    expires_at: Date.now() + ((parseInt(p.expires_in, 10) || 3600) * 1000) - 60000,
    user: null
  });
  var recovery = p.type === "recovery";
  history.replaceState(null, "", redirectTarget() + "#/tagebuch");

  fetchUser().then(function(){
    setLocalOnly(false);
    if(recovery){
      ui.auth.mode = "newpw";
      ui.auth.msg = "Bitte vergib jetzt ein neues Passwort.";
      render();
    }else{
      render();
      toast("E-Mail bestätigt – willkommen ✦");
      doSync(true);
    }
  }).catch(function(e){
    setSession(null);
    ui.auth.mode = "login";
    ui.auth.msg = "Der Link ist abgelaufen. Bitte melde dich an.";
    render();
  });
  return true;
}

/* ---------- Auth-Aufrufe ---------- */
function authRegister(name, email, pw){
  return api("/auth/v1/signup?redirect_to=" + encodeURIComponent(redirectTarget()), {
    method:"POST", noAuth:true,
    body: JSON.stringify({ email:email, password:pw, data:{ name:name } })
  }).then(function(d){
    if(d && d.access_token) storeToken(d);
    return d;
  });
}
function authRecover(email){
  return api("/auth/v1/recover?redirect_to=" + encodeURIComponent(redirectTarget()), {
    method:"POST", noAuth:true, body: JSON.stringify({ email:email })
  });
}
/* Konto löschen: erst die eigenen Zeilen, dann das Konto selbst.
   Die Funktion delete_own_account steckt in supabase.sql. */
function kontoLoeschen(){
  var uid_ = sess.user.id;
  return ensureToken()
    .then(function(){
      return Promise.all([
        api("/rest/v1/journal_entries?user_id=eq." + uid_, {method:"DELETE"}),
        api("/rest/v1/goals?user_id=eq." + uid_,           {method:"DELETE"}),
        api("/rest/v1/app_meta?user_id=eq." + uid_,        {method:"DELETE"}),
        api("/rest/v1/push_subscriptions?user_id=eq." + uid_, {method:"DELETE"}).catch(function(){ return null; })
      ]);
    })
    .then(function(){
      // Konto selbst entfernen – braucht die SQL-Funktion aus supabase.sql
      return api("/rest/v1/rpc/delete_own_account", {method:"POST", body:"{}"});
    })
    .then(function(){
      localStorage.removeItem(KEY);
      S = migrate(null);
      save();
      return true;
    });
}
function authSetPassword(pw){
  return api("/auth/v1/user", { method:"PUT", body: JSON.stringify({ password: pw }) });
}

function translateAuthError(msg){
  msg = String(msg || "");
  if(/Invalid login credentials/i.test(msg))      return "E-Mail oder Passwort stimmt nicht.";
  if(/already registered|already exists/i.test(msg)) return "Für diese E-Mail gibt es schon ein Konto – melde dich einfach an.";
  if(/Email not confirmed/i.test(msg))            return "Bitte bestätige zuerst den Link in deiner E-Mail.";
  if(/Password should be at least/i.test(msg))    return "Das Passwort ist zu kurz.";
  if(/rate limit|too many/i.test(msg))            return "Zu viele Versuche. Bitte warte einen Moment.";
  if(/Failed to fetch|NetworkError/i.test(msg))   return "Keine Verbindung zum Server. Bist du online?";
  if(/relation .* does not exist/i.test(msg) || /schema cache/i.test(msg) || /PGRST205/i.test(msg))
    return "Die Datenbank ist noch nicht fertig eingerichtet – supabase.sql muss im SQL-Editor laufen.";
  if(/permission denied/i.test(msg))
    return "Die Datenbank verweigert den Zugriff – fehlen die Policies aus supabase.sql?";
  return msg || "Unbekannter Fehler.";
}


/* =========================================================
   Erinnerungen (Web Push)

   Der Browser meldet sich beim Push-Dienst an, die Anmeldung
   landet in der Tabelle push_subscriptions. Eine geplante
   Funktion in Supabase schickt zur eingestellten Uhrzeit die
   Nachricht – und lässt sie aus, wenn der Tag schon steht.
   ========================================================= */
function pushSupported(){
  return ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
}
function vapidKey(){ return (CFG && CFG.vapidPublicKey) || ""; }
function remindersReady(){ return pushSupported() && syncConfigured() && !!vapidKey() && loggedIn(); }

function defaultReminders(){
  return { enabled:false, morning:"07:30", evening:"21:00" };
}
function reminders(){
  S.reminders = Object.assign(defaultReminders(), S.reminders || {});
  return S.reminders;
}
function timeZone(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Berlin"; }
  catch(e){ return "Europe/Berlin"; }
}
function urlBase64ToUint8Array(base64String){
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var raw = atob(base64);
  var out = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function subToRow(sub){
  var json = sub.toJSON();
  var r = reminders();
  return {
    user_id: sess.user.id,
    endpoint: json.endpoint,
    p256dh: json.keys && json.keys.p256dh,
    auth: json.keys && json.keys.auth,
    morning: r.enabled ? r.morning : null,
    evening: r.enabled ? r.evening : null,
    tz: timeZone(),
    updated_at: Date.now()
  };
}
function saveSubscription(sub){
  return api("/rest/v1/push_subscriptions?on_conflict=endpoint", {
    method:"POST",
    headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify([subToRow(sub)])
  });
}
function currentSubscription(){
  if(!pushSupported()) return Promise.resolve(null);
  return navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); });
}

/* Erinnerungen einschalten: Erlaubnis holen, anmelden, hinterlegen. */
function enableReminders(){
  if(!pushSupported()) return Promise.reject(new Error("Dieser Browser kann keine Erinnerungen."));
  if(!vapidKey())      return Promise.reject(new Error("Für dieses Projekt ist noch kein Push-Schlüssel hinterlegt."));
  if(!loggedIn())      return Promise.reject(new Error("Dafür musst du angemeldet sein."));

  return Notification.requestPermission().then(function(perm){
    if(perm !== "granted") throw new Error("Ohne Erlaubnis für Mitteilungen geht es nicht. Das lässt sich in den iPhone-Einstellungen unter Mitteilungen wieder ändern.");
    return navigator.serviceWorker.ready;
  }).then(function(reg){
    return reg.pushManager.getSubscription().then(function(existing){
      if(existing) return existing;
      return reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(vapidKey())
      });
    });
  }).then(function(sub){
    reminders().enabled = true;
    touchMeta(); save();
    return ensureToken().then(function(){ return saveSubscription(sub); });
  });
}

/* Ausschalten: Anmeldung zurückziehen und Zeiten leeren. */
function disableReminders(){
  reminders().enabled = false;
  touchMeta(); save();
  return currentSubscription().then(function(sub){
    if(!sub) return null;
    var endpoint = sub.toJSON().endpoint;
    return sub.unsubscribe().catch(function(){}).then(function(){
      if(!loggedIn()) return null;
      return ensureToken().then(function(){
        return api("/rest/v1/push_subscriptions?endpoint=eq." + encodeURIComponent(endpoint), { method:"DELETE" });
      });
    });
  }).catch(function(){ return null; });
}

/* Zeiten geändert: bestehende Anmeldung aktualisieren. */
function syncReminderTimes(){
  if(!remindersReady() || !reminders().enabled) return Promise.resolve(false);
  return currentSubscription().then(function(sub){
    if(!sub) return false;
    return ensureToken().then(function(){ return saveSubscription(sub); }).then(function(){ return true; });
  }).catch(function(){ return false; });
}

function translatePushError(msg){
  msg = String(msg || "");
  if(/permission denied|not allowed|NotAllowedError/i.test(msg))
    return "Der Browser hat die Anmeldung abgelehnt. Auf dem iPhone muss die App vom Home-Bildschirm aus geöffnet sein.";
  if(/Registration failed|AbortError|push service/i.test(msg))
    return "Der Push-Dienst hat die Anmeldung abgelehnt. Prüfe, ob der VAPID-Schlüssel zum Projekt passt.";
  if(/applicationServerKey|InvalidAccessError|InvalidCharacterError/i.test(msg))
    return "Der hinterlegte Push-Schlüssel ist ungültig.";
  if(/Failed to fetch|NetworkError/i.test(msg))
    return "Keine Verbindung zum Server. Bist du online?";
  return msg;
}
function reminderStatus(){
  if(!pushSupported())  return "Dieser Browser unterstützt keine Erinnerungen.";
  if(!syncConfigured()) return "Erst ein Konto verbinden.";
  if(!loggedIn())       return "Dafür musst du angemeldet sein.";
  if(!vapidKey())       return "Für dieses Projekt ist noch kein Push-Schlüssel hinterlegt (siehe README).";
  if(Notification.permission === "denied") return "Mitteilungen sind für diese Seite blockiert – das lässt sich nur in den Systemeinstellungen wieder erlauben.";
  if(!reminders().enabled) return "Aus.";
  return "An · morgens " + reminders().morning + " · abends " + reminders().evening;
}

function reminderCard(){
  var r = reminders();
  var moeglich = remindersReady() && Notification.permission !== "denied";
  var standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  return `<div class="card">
    <div class="between" style="margin-bottom:6px">
      <h2>Erinnerungen</h2>
      <span class="tag" style="${r.enabled ? "color:var(--mint)" : ""}">${r.enabled ? "an" : "aus"}</span>
    </div>
    <div class="sub">Ein Stups morgens und abends – wird übersprungen, wenn der Tag schon steht.</div>

    ${iOS && !standalone ? `<p class="small" style="color:var(--gold)">Auf dem iPhone gehen Mitteilungen nur,
      wenn die App über <b>Teilen → Zum Home-Bildschirm</b> installiert ist. Öffne sie danach von dort aus.</p>` : ""}

    <div class="grid2">
      <div><label class="f">Morgens</label>
        <input type="time" id="remMorning" step="300" value="${esc(r.morning)}" ${moeglich ? "" : "disabled"} /></div>
      <div><label class="f">Abends</label>
        <input type="time" id="remEvening" step="300" value="${esc(r.evening)}" ${moeglich ? "" : "disabled"} /></div>
    </div>

    <button class="btn ${r.enabled ? "" : "primary"} wide mt" id="remToggle" ${moeglich || r.enabled ? "" : "disabled"}>
      ${r.enabled ? "Erinnerungen ausschalten" : "Erinnerungen einschalten"}
    </button>
    <p class="tiny muted mt" id="remStatus">${esc(reminderStatus())}</p>
    ${r.enabled ? `<button class="btn ghost wide mt tiny" id="remTest">Testmitteilung anzeigen</button>` : ""}
  </div>`;
}

function bindReminders(){
  var t = $("#remToggle");
  if(t) t.addEventListener("click", function(){
    t.disabled = true;
    var an = reminders().enabled;
    (an ? disableReminders() : enableReminders())
      .then(function(){
        render();
        toast(an ? "Erinnerungen aus" : "Erinnerungen an ✦");
      })
      .catch(function(e){
        t.disabled = false;
        var text = translatePushError(e && e.message);
        var st = $("#remStatus");
        if(st) st.textContent = text;
        toast(text);
      });
  });

  ["remMorning","remEvening"].forEach(function(id){
    var el = $("#" + id);
    if(!el) return;
    el.addEventListener("change", function(){
      if(!el.value) return;
      reminders()[id === "remMorning" ? "morning" : "evening"] = el.value;
      touchMeta(); save();
      syncReminderTimes().then(function(ok){
        toast(ok ? "Zeit gespeichert ✦" : "Zeit gespeichert");
        var st = $("#remStatus");
        if(st) st.textContent = reminderStatus();
      });
    });
  });

  var test = $("#remTest");
  if(test) test.addEventListener("click", function(){
    if(!pushSupported() || Notification.permission !== "granted"){ toast("Keine Erlaubnis für Mitteilungen"); return; }
    navigator.serviceWorker.ready.then(function(reg){
      reg.showNotification("Frequenz-Tagebuch", {
        body: "So sieht deine Erinnerung aus ✦",
        icon: "./icon-192.png", badge: "./icon-192.png", tag: "test"
      });
    });
  });
}

/* =========================================================
   Box-Atmung (4-4-4-4)
   ========================================================= */
function openBreath(){
  var host = $("#overlayHost");
  host.innerHTML = `<div class="overlay">
    <div class="small muted">Box-Atmung · 4 Sekunden je Phase</div>
    <div class="breath" id="ball"></div>
    <div class="phase" id="phase">Bereit …</div>
    <div class="small muted" id="rounds" style="margin-top:6px">Runde 0 von 4</div>
    <button class="btn wide" id="closeBreath" style="max-width:260px;margin-top:26px">Beenden</button>
  </div>`;
  var ball = $("#ball"), phaseEl = $("#phase"), roundsEl = $("#rounds");
  var phases = [{t:"Einatmen …",big:true},{t:"Halten …",big:true},{t:"Ausatmen …",big:false},{t:"Halten …",big:false}];
  var i = -1, round = 0, timer;
  function step(){
    i = (i + 1) % 4;
    if(i === 0){
      round++;
      if(round > 4){ finish(); return; }
      roundsEl.textContent = "Runde " + round + " von 4";
    }
    phaseEl.textContent = phases[i].t;
    ball.classList.toggle("big", phases[i].big);
    timer = setTimeout(step, 4000);
  }
  function finish(){ phaseEl.textContent = "Fertig ✦ Spür kurz nach."; ball.classList.remove("big"); setTimeout(close, 2500); }
  function close(){ clearTimeout(timer); host.innerHTML = ""; }
  $("#closeBreath").addEventListener("click", close);
  setTimeout(step, 400);
}

/* =========================================================
   Router
   ========================================================= */
var ROUTES = {
  tagebuch: {title:"Tagebuch",  tab:"tagebuch", view:viewTagebuch, bind:bindTagebuch},
  archiv:   {title:"Archiv",    tab:"tagebuch", view:viewArchiv,   bind:bindArchiv},
  wochen:   {title:"8 Wochen",  tab:"wochen",   view:viewWochen,   bind:bindWochen},
  frequenz: {title:"Frequenz",  tab:"frequenz", view:viewFrequenz, bind:bindFrequenz},
  ziele:    {title:"Manifestieren", tab:"ziele", view:viewZiele,   bind:bindZiele},
  mehr:     {title:"Mehr",      tab:"mehr",     view:viewMehr,     bind:bindMehr}
};
function currentRoute(){
  var h = (location.hash || "#/tagebuch").replace("#/", "").split("/")[0];
  return ROUTES[h] ? h : "tagebuch";
}
function greeting(){
  var h = new Date().getHours();
  var g = h < 5 ? "Gute Nacht" : h < 11 ? "Guten Morgen" : h < 17 ? "Schönen Tag" : h < 22 ? "Guten Abend" : "Gute Nacht";
  return S.name ? g + ", " + S.name : g;
}
function updateStreakBadge(){
  var st = streak();
  $("#streakBadge").textContent = "✦ " + st + (st === 1 ? " Tag" : " Tage");
}
function render(){
  var gate = authGateActive();
  document.body.classList.toggle("auth-mode", gate);
  if(gate){
    $("#view").innerHTML = authScreen();
    bindAuthScreen();
    return;
  }
  var key = currentRoute(), route = ROUTES[key];
  $("#hello").textContent = greeting();
  $("#pageTitle").textContent = route.title;
  updateStreakBadge();
  var v = $("#view");
  v.innerHTML = route.view();
  route.bind();
  $$("nav.tabs a").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-tab") === route.tab); });
}
window.addEventListener("hashchange", function(){
  // Bestätigungs- oder Passwort-Link kann auch in ein offenes Fenster fallen
  if(consumeAuthHash()) return;
  window.scrollTo(0,0);
  render();
});

/* Tageswechsel abfangen, wenn die App im Hintergrund lag */
var lastDay = dkey();
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ save(); return; }
  if(dkey() !== lastDay){ lastDay = dkey(); ui.day = dkey(); ui.sections = null; render(); }
  doSync(true);
});
window.addEventListener("online", function(){ doSync(true); });
window.addEventListener("beforeunload", function(){ clearTimeout(saveTimer); save(); });

save();
consumeAuthHash();
if(!location.hash) location.hash = "#/tagebuch";
render();
doSync(true);

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
